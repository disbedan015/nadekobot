setnick:
  desc: Sets the bot's nickname on this server.
  ex:
    - 'MyBotName'
  params:
    - newNick:
        desc: The new nickname for the bot.
setusernick:
  desc: Sets the nickname of the specified user.
  ex:
    - '@User1 NewNickname'
  params:
    - user:
        desc: The user whose nickname to change.
    - newNick:
        desc: The new nickname for the user. Leave empty to remove.
removenick:
  desc: Removes the nickname of the specified user.
  ex:
    - '@User1'
  params:
    - user:
        desc: The user whose nickname to remove.
