```yaml
edit:
  desc: |-
    Edits a message sent by the bot with the specified ID.
    Provide the message ID and the new text.
    If the message is in a different channel, provide the channel mention/ID first.
  ex:
    - "123123123 New Text"
    - "#general 456456456 Edited Content"
  params:
    - messageId:
        desc: ID of the message to edit.
      text:
        desc: The new content for the message.
    - channel:
        desc: Channel where the message is located.
      messageId:
        desc: ID of the message to edit.
      text:
        desc: The new content for the message.
delete:
  desc: |-
    Deletes a message with the specified ID.
    Optionally provide a time (e.g., 5m, 1h) to delete the message after that duration.
    You can also provide a message link instead of ID/channel.
  ex:
    - "123123123"
    - "456456456 10s"
    - "#general 789789789"
    - "https://discord.com/channels/123/456/789"
  params:
    - messageId:
        desc: ID of the message to delete.
      timespan:
        desc: Optional delay before deletion (max 7 days).
    - messageLink:
        desc: Link to the message to delete.
      timespan:
        desc: Optional delay before deletion (max 7 days).
    - channel:
        desc: Channel where the message is located.
      messageId:
        desc: ID of the message to delete.
      timespan:
        desc: Optional delay before deletion (max 7 days).

```
