deltxtchanl:
  desc: Deletes a text channel with the specified name.
  ex:
    - "#general"
    - "123123123"
  params:
    - toDelete:
        desc: The text channel to delete. Can be a mention or ID.
creatxtchanl:
  desc: Creates a new text channel with the specified name.
  ex:
    - "new-channel"
  params:
    - channelName:
        desc: The name for the new text channel.
settopic:
  desc: Sets the topic for the current channel. Clears the topic if no text is provided.
  ex:
    - "Welcome to the server!"
    - ""
  params:
    - topic:
        desc: The new topic for the channel.
setchanlname:
  desc: Sets the name for the current channel.
  ex:
    - "general-chat"
  params:
    - name:
        desc: The new name for the channel.
