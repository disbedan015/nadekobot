threadcreate:
  desc: Creates a new thread in the current channel, optionally attached to a referenced message.
  ex:
    - 'My New Thread'
    - (when replying to a message) 'Discussion about this'
  params:
    - name:
        desc: The name of the new thread.
threaddelete:
  desc: Deletes the specified thread in the current channel.
  ex:
    - 'My Old Thread'
  params:
    - name:
        desc: The name of the thread to delete.
